# Servidor do site estático, atrás do Traefik do Easypanel.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamento relativo: atrás do proxy, o nginx não sabe que o
    # visitante chegou por HTTPS e montaria "http://..." num redirect absoluto.
    absolute_redirect off;

    # Um endereço só. O Traefik preserva o Host original.
    if ($host = www.shiftsys.com.br) {
        return 301 https://shiftsys.com.br$request_uri;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Arquivo oculto (ex.: .openai/hosting.json, que o build copia) não é público.
    location ~ /\. {
        return 404;
    }

    # Os assets não têm hash no nome: cache curto, para um deploy novo aparecer
    # em no máximo uma hora. `expires` não substitui os add_header acima; um
    # add_header aqui dentro substituiria.
    location /assets/ {
        expires 1h;
    }

    # Os links do site são "pagina.html"; "/pagina" também funciona.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
}
