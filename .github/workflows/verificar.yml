# Verificação do site e do CRM a cada push.
#
# Roda aqui, e não só na máquina do Bruno, por dois motivos: a máquina de
# desenvolvimento não tem Docker (então as imagens nunca seriam construídas
# antes do Easypanel), e às vezes não tem memória livre para o PGlite dos testes.
name: Verificar

on:
  push:
    branches: [vps, main]
  pull_request:
  workflow_dispatch:

jobs:
  crm:
    name: CRM — testes, tipos, lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  site:
    name: Site — imagem e nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem, como o Easypanel faz
        run: docker build -t shift-site site
      - name: Conferir a configuração do nginx
        run: docker run --rm shift-site nginx -t
      - name: Subir e testar as respostas
        run: bash .github/scripts/fumaca-site.sh

  crm-imagem:
    name: CRM — imagem, banco de verdade e leads
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem, como o Easypanel faz
        run: docker build -t shift-crm crm
      - name: Preparar o banco, subir o CRM e mandar leads
        run: bash .github/scripts/fumaca-crm.sh
